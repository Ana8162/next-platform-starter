<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Agenda Deportiva y Cultural</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .close {
            color: #999;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>🏆 Agenda Deportiva y Cultural</h1>
                <p>Gestión de Categorías</p>
            </div>
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="eventos.html">Eventos</a>
                <a href="participantes.html">Participantes</a>
                <a href="inscripciones.html">Inscripciones</a>
                <a href="categorias.html" class="active">Categorías</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 40px 20px;">
        <div class="page-header">
            <h2>Gestión de Categorías</h2>
            <a href="#" class="btn btn-primary" onclick="mostrarFormularioCategoria(); return false;">➕ Nueva Categoría</a>
        </div>

        <div class="table-responsive">
            <table class="table" id="tablaCategorias">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                        <th>Eventos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL CATEGORÍA -->
    <div class="modal" id="modalCategoria">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal('modalCategoria')">&times;</span>
            <h2>Nueva Categoría</h2>
            <form id="formCategoria" class="form-card">
                <input type="hidden" id="idCategoria">
                <div class="form-grid">
                    <div class="form-group span-2">
                        <label>Nombre de la Categoría *</label>
                        <input type="text" id="nombreCategoria" required>
                    </div>
                    <div class="form-group span-2">
                        <label>Tipo *</label>
                        <select id="tipoCategoria" required>
                            <option value="">Selecciona</option>
                            <option value="Deportivo">Deportivo</option>
                            <option value="Cultural">Cultural</option>
                        </select>
                    </div>
                    <div class="form-group span-2">
                        <label>Descripción</label>
                        <textarea id="descripcionCategoria" rows="4"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="btnGuardarCategoria" class="btn btn-primary" onclick="guardarCategoria()">Crear Categoría</button>
                    <button type="button" class="btn" onclick="cerrarModal('modalCategoria')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Agenda Deportiva y Cultural de Tezoyuca Tequisistlán</p>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
